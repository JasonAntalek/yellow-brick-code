<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Yellow Brick Code — Threshold 00 // Overture</title>
<style>
  :root {
    --bg: #11100e;
    --text: #d8d2c5;
    --muted: #7a7467;
    --gold: #d4af37;
    --gold-glow: rgba(212, 175, 55, 0.14);
    --cold: #7b9095;
    --field: #c89d66;
    --ochre: #ba9867;
    --border: rgba(216, 210, 197, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.78;
    font-size: 19px;
    transition: background 1.1s ease, color 0.8s ease;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body.mode-flattery {
    background: #17140b;
    box-shadow: inset 0 0 120px rgba(212, 175, 55, 0.12);
  }

  body.mode-cynic {
    background: #0c0f12;
    color: #b8c2c7;
  }

  body.mode-field {
    background: #141210;
  }

  .kaiya-ambient-presence {
    position: fixed;
    top: 4vh;
    right: 2vw;
    width: min(54vw, 760px);
    height: 88vh;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: lighten;
    opacity: 0.22;
    filter: grayscale(0.5) contrast(1.2) brightness(0.75);
    --silhouette: radial-gradient(ellipse 58% 64% at 48% 40%, #000 18%, rgba(0,0,0,0.45) 48%, transparent 74%);
    -webkit-mask-image: var(--silhouette);
    mask-image: var(--silhouette);
    transform: translate3d(0, calc(var(--scroll-y, 0px) * -0.06), 0);
    transition: opacity 1.4s ease, filter 1.4s ease, transform 1.2s ease;
  }
  .ambient-composition { position: absolute; inset: 0; }
  .ambient-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    mix-blend-mode: lighten;
    transition: opacity 1.2s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), filter 1.2s ease;
  }
  .ambient-composition.is-group {
    bottom: auto;
    width: 100%;
    aspect-ratio: 1.2;
    max-height: 100%;
  }
  .ambient-composition.is-composite {
    top: 12%;
    max-height: 88%;
    isolation: isolate;
  }
  .is-composite .ambient-layer {
    --portrait: radial-gradient(ellipse 28% 72% at 49% 35%, black 28%, rgba(0,0,0,0.8) 50%, transparent 95%);
    --edges: linear-gradient(to bottom, transparent, black 8%, black 62%, transparent 98%);
    -webkit-mask-image: var(--portrait), var(--edges);
    -webkit-mask-composite: source-in;
    mask-image: var(--portrait), var(--edges);
    mask-composite: intersect;
  }
  .is-composite .companion-kaiya {
    --portrait: radial-gradient(ellipse 22% 59% at 51% 33%, black 27%, rgba(0,0,0,0.8) 51%, transparent 96%);
    z-index: 2;
  }
  .ambient-layer.companion-ferros {
    --portrait: radial-gradient(ellipse 24% 59% at 57% 18%, black 25%, rgba(0,0,0,0.8) 50%, transparent 94%);
    object-position: 20% 22%;
    transform: translate3d(14%, -6%, 0) scale(0.92);
    opacity: 0.72;
  }
  .ambient-layer.companion-pell {
    --portrait: radial-gradient(ellipse 26% 61% at 50% 20%, black 25%, rgba(0,0,0,0.8) 50%, transparent 94%);
    transform: translate3d(-16%, -8%, 0) scale(0.90);
    opacity: 0.68;
  }
  .ambient-layer.companion-vael {
    transform: translate3d(8%, 18%, 0) scale(0.95);
    object-position: 16% center;
    opacity: 0.75;
    z-index: 1;
  }
  @media (width > 1024px) {
    .kaiya-ambient-presence:has(.is-group) {
      --silhouette: radial-gradient(ellipse 64% 72% at 49% 40%, black 30%, rgba(0,0,0,0.75) 58%, transparent 94%);
    }
    .ambient-composition:not(.is-group) .companion-kaiya {
      /* Fully lose the doorway, even where its bright edge crosses the radial feather. */
      -webkit-mask-image: linear-gradient(to right, black 58%, transparent 73%);
      mask-image: linear-gradient(to right, black 58%, transparent 73%);
    }
  }
  .mode-flattery .kaiya-ambient-presence {
    opacity: 0.14;
    filter: sepia(0.6) saturate(1.4) brightness(0.6) blur(1.2px);
  }
  .mode-cynic .kaiya-ambient-presence {
    opacity: 0.26;
    filter: grayscale(0.95) contrast(1.45) brightness(0.68);
  }
  .mode-field .kaiya-ambient-presence {
    opacity: 0.38;
    filter: grayscale(0.1) contrast(1.15) brightness(0.92);
  }

  #kaiya-presence.yield-to-ferros { opacity: 0.06; }

  .stage {
    position: relative;
    z-index: 2;
    max-width: 1240px;
    margin: 0 auto;
    padding: 84px 64px 160px;
  }
  .manuscript {
    width: 50vw;
    max-width: 580px;
    margin-left: 24px;
    overflow-wrap: anywhere;
  }

  .chapter-meta {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 36px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }

  .chapter-meta nav { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.45em; }
  .chapter-meta button {
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    padding: 2px;
    cursor: pointer;
  }
  .chapter-meta button[aria-current="page"] { color: var(--text); }
  .chapter-meta button:disabled { opacity: 0.4; cursor: default; }
  .chapter-meta button:enabled:hover, .chapter-meta button:focus-visible { color: var(--text); opacity: 1; }
  .chapter-meta .reset-journey { margin-left: auto; font-size: 10px; opacity: 0.45; }
  .chapter-title { font-size: 1.4em; font-weight: normal; }
  .trap-tag {
    display: block;
    margin-bottom: 1em;
    font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #chapter-readout { align-self: center; }
  #crossroads-plate.chalk-fallback {
    background-color: #25221b;
    background-image:
      repeating-linear-gradient(34deg, transparent 0 47px, #776e58 48px, transparent 49px 91px),
      repeating-linear-gradient(-34deg, transparent 0 33px, #5b5446 34px, transparent 35px 89px),
      repeating-linear-gradient(90deg, transparent 0 72px, #484336 73px, transparent 74px);
  }
  #storage-status { color: var(--text); font-size: 0.85em; }
  [hidden] { display: none !important; }

  p { margin: 0 0 1.45em; }

  .seam-trigger {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dashed rgba(216, 210, 197, 0.42);
    cursor: pointer;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .seam-trigger:hover {
    color: #fff;
    border-bottom-color: var(--cold);
  }
  .seam-trigger.locked {
    border-bottom: none;
    cursor: default;
    color: inherit;
    pointer-events: none;
  }

  .threshold-box {
    margin-top: 42px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
  }

  .gold-invitation {
    display: block;
    width: 100%;
    text-align: left;
    background: linear-gradient(90deg, var(--gold-glow), transparent);
    border: 1px solid rgba(212, 175, 55, 0.35);
    color: #f2dfb3;
    padding: 18px 22px;
    font-family: inherit;
    font-size: 18px;
    font-style: italic;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.35s ease;
  }
  .gold-invitation:hover {
    border-color: var(--gold);
    box-shadow: 0 0 28px rgba(212, 175, 55, 0.18);
    transform: translateY(-1px);
  }

  .cul-de-sac {
    margin-top: 36px;
    padding: 24px 26px;
    background: rgba(255, 255, 255, 0.02);
    animation: fadeIn 0.8s ease forwards;
  }

  .cul-de-sac.flattery { border-left: 2px solid var(--gold); }
  .cul-de-sac.cynic { border-left: 2px solid var(--cold); }

  .canon-continuation {
    margin-top: 44px;
    padding-top: 36px;
    border-top: 1px solid rgba(200, 157, 102, 0.35);
    animation: fadeIn 1s ease forwards;
  }

  .next-beat-btn, .field-btn, .subtle-link {
    background: transparent;
    border: 1px solid rgba(216, 210, 197, 0.32);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .next-beat-btn:hover, .field-btn:hover, .subtle-link:hover {
    border-color: var(--field);
    color: #fff;
    background: rgba(200, 157, 102, 0.08);
  }

  .ferros-exchange {
    margin-top: 26px;
    padding: 20px;
    border-left: 2px solid var(--field);
    background: rgba(200, 157, 102, 0.04);
  }

  .field-bridge {
    margin-top: 28px;
    animation: fadeIn 0.45s ease both;
  }
  .field-bridge label {
    display: block;
    margin-bottom: 16px;
  }
  .canon-continuation:focus, .ferros-immersive-stage:focus, [data-resolution]:focus { outline: none; }

  .ferros-exchange label {
    display: block;
    font-size: 14px;
    color: #e0cdb4;
    margin-bottom: 10px;
  }

  .field-input {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 15.5px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .field-input:focus {
    outline: none;
    border-color: var(--field);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .visual-plate {
    overflow: hidden;
    pointer-events: none;
    mix-blend-mode: lighten;
    -webkit-mask-image: var(--vignette), var(--side-fade), var(--end-fade);
    -webkit-mask-composite: source-in;
    mask-image: var(--vignette), var(--side-fade), var(--end-fade);
    mask-composite: intersect;
  }
  .visual-plate img, .visual-plate video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.9s ease;
  }

  :is(#curb-plate, #crossroads-plate, #timberline-plate) {
    --bleed: 70px;
    --vignette: radial-gradient(ellipse 76% 68% at 50% 50%, #000 28%, rgba(0,0,0,0.55) 62%, transparent 94%);
    --side-fade: linear-gradient(to right, transparent, black 12%, black 88%, transparent);
    --end-fade: linear-gradient(to bottom, transparent, black 23%, black 73%, transparent);
    position: relative;
    z-index: -1;
    width: calc(100% + 2 * var(--bleed));
    margin: -18px calc(-1 * var(--bleed)) -28px;
    aspect-ratio: 16 / 9;
  }
  :is(#curb-img, #crossroads-img, #timberline-img) {
    --grade: contrast(1.04) saturate(0.92) brightness(0.92);
    filter: var(--grade) brightness(calc(0.72 + var(--curb-light, 0.5) * 0.38))
            contrast(calc(1.05 + var(--curb-light, 0.5) * 0.18));
    transform: scale(calc(var(--plate-scale, 1) + var(--curb-light, 0.5) * 0.04));
    transition: filter 0.4s ease, transform 0.4s ease;
  }
  body.mode-flattery :is(#curb-img, #crossroads-img, #timberline-img) {
    --grade: sepia(0.55) saturate(1.65) brightness(1.08) contrast(0.92) blur(0.4px);
    --plate-scale: 1.03;
  }
  body.mode-cynic :is(#curb-img, #crossroads-img, #timberline-img) {
    --grade: grayscale(0.88) contrast(1.38) brightness(0.78) hue-rotate(170deg);
    --plate-scale: 0.99;
  }
  body.mode-field :is(#curb-img, #crossroads-img, #timberline-img) { --grade: contrast(1.08) saturate(1.05) brightness(1); }

  :is(#curb-shade-sweep, #crossroads-shade-sweep, #timberline-shade-sweep) {
    position: absolute;
    inset: 0;
    background-size: 210% 100%;
    background-position: calc((1 - var(--curb-light, 0.5)) * 100%) 50%;
    background-image: linear-gradient(115deg, rgba(17,16,14,0.88), rgba(17,16,14,0.6) 37%, transparent 50%, rgba(17,16,14,0.72) 73%);
    mix-blend-mode: multiply;
  }
  :is(#curb-plate, #crossroads-plate, #timberline-plate)::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 40%, rgba(227,185,94,0.18) 49%, rgba(250,213,134,0.34) 51%, transparent 59%);
    background-size: 210% 100%;
    background-position: calc((1 - var(--curb-light, 0.5)) * 100%) 50%;
    mix-blend-mode: soft-light;
  }

  main { position: relative; overflow-x: clip; }
  .stage:has(+ #chapter-scenes > .ferros-immersive-stage) { padding-bottom: 12px; }
  .ferros-immersive-stage {
    --scene-height: clamp(680px, 85vh, 900px);
    position: relative;
    z-index: 2;
    width: min(92vw, 1180px);
    min-height: var(--scene-height);
    margin: 20px auto 60px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
    scroll-margin-top: 12px;
  }
  .ferros-backdrop, .ferros-prose-overlay { grid-area: 1 / 1; }
  .ferros-backdrop {
    position: sticky;
    top: min(4vh, 36px);
    align-self: start;
    height: var(--scene-height);
    pointer-events: none;
  }
  :is(#ferros-plate, #pell-plate, #vael-plate) {
    position: absolute;
    top: -40px;
    right: -6%;
    width: 84%;
    height: 112%;
    z-index: 1;
    --vignette: radial-gradient(ellipse 78% 76% at 56% 48%, black 35%, rgba(0,0,0,0.6) 66%, transparent 96%);
    --side-fade: linear-gradient(to right, transparent, rgba(0,0,0,0.35) 24%, black 48%, black 82%, transparent);
    --end-fade: linear-gradient(to bottom, transparent, black 12%, black 70%, transparent 98%);
    transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), filter 1.2s ease;
  }
  :is(#ferros-plate, #pell-plate, #vael-plate).gaze-locked { transform: scale(1.045); filter: contrast(1.12) brightness(1.08); }
  .ferros-prose-overlay {
    position: relative;
    z-index: 3;
    width: min(43%, 500px);
    padding: 40px 0;
    text-shadow: 0 2px 18px rgba(10,9,8,0.95);
  }
  :is(#ferros-resolution, #pell-resolution, #vael-resolution) { scroll-margin-top: 7vh; overflow-wrap: anywhere; }
  :is(#ferros-resolution, #pell-resolution, #vael-resolution):not(:empty) { min-height: 84svh; }

  /* Paint the inset glow above the footage. */
  :is(#ferros-plate, #pell-plate, #vael-plate)::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(200, 157, 102, 0.16);
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  :is(#ferros-plate, #pell-plate, #vael-plate).gaze-held::after { opacity: 1; }

  .timberline-mist-veil {
    position: relative;
    transition: filter 0.45s ease, opacity 0.45s ease;
    filter: blur(calc(var(--scroll-velocity, 0) * 3.5px));
  }
  /* While scrolling, follow each speed sample directly; ease back into focus at rest. */
  .mist-rushing .timberline-mist-veil { transition-property: opacity; }
  .mist-warning {
    position: relative;
    margin: -12px 0 18px;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ochre);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .mist-rushing .mist-warning { opacity: calc(var(--scroll-velocity, 0) * 0.9); }
  #timberline-plate {
    background: repeating-linear-gradient(93deg, #171b17 0 8%, #222821 10%, #101310 12% 17%);
    isolation: isolate;
  }
  .cedar-fog {
    position: absolute;
    inset: -12%;
    background:
      radial-gradient(ellipse 57% 19% at 32% 58%, #bac4b3 0%, transparent 85%),
      radial-gradient(ellipse 43% 24% at 79% 46%, #85978a 0%, transparent 88%);
    mix-blend-mode: screen;
    opacity: calc(0.06 + var(--scroll-velocity, 0) * 0.65);
    transform: translate3d(calc((var(--curb-light, 0.5) - 0.5) * 50px), 0, 0);
    transition: opacity 0.4s ease, transform 0.35s ease;
  }
  .stage.mist-rushing #timberline-img { filter: var(--grade) brightness(0.55); }
  body.mode-cynic #timberline-img { --grade: grayscale(1) contrast(0.83) brightness(0.70); }
  .timberline-presence {
    transform: translate3d(0, calc(var(--scroll-y, 0px) * -0.035), 0) scale(calc(1 - var(--scroll-velocity, 0) * 0.07));
  }
  .timberline-presence .ambient-composition {
    opacity: calc(1 - var(--scroll-velocity, 0) * 0.65);
    transition: opacity 0.45s ease;
  }
  @keyframes sonicTremor {
    0%, 100% { transform: translate3d(0, 0, 0); }
    15% { transform: translate3d(-6px, 3px, 0) scale(1.008); }
    30% { transform: translate3d(7px, -4px, 0); }
    45% { transform: translate3d(-5px, -2px, 0) scale(0.996); }
    60% { transform: translate3d(4px, 3px, 0); }
    75% { transform: translate3d(-3px, 1px, 0); }
  }
  @keyframes roarLight {
    from { opacity: 0.34; transform: scale(0.62); }
    to { opacity: 0; transform: scale(1.35); }
  }
  body.mode-flattery .manuscript.roar-shake {
    animation: sonicTremor 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  .manuscript.roar-shake .cul-de-sac { position: relative; }
  .manuscript.roar-shake .cul-de-sac::before {
    content: "";
    position: absolute;
    pointer-events: none;
    inset: -15%;
    background: radial-gradient(ellipse, transparent 36%, #b28c49 50%, transparent 71%);
    animation: roarLight 0.65s ease-out both;
  }
  .roar-shake .cedar-fog { opacity: 0; }

  @media (max-width: 1024px) {
    .stage { padding: 56px 36px 120px; }
    .manuscript {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding-top: 18vh;
    }
    .kaiya-ambient-presence {
      position: absolute;
      top: 0;
      right: -4vw;
      width: 78vw;
      height: 56vh;
      opacity: 0.24;
      --silhouette: linear-gradient(to bottom, black 12%, rgba(0,0,0,0.65) 37%, transparent 82%);
      -webkit-mask-image: var(--silhouette), radial-gradient(ellipse 65% 84% at 50% 30%, black 24%, transparent 85%);
      -webkit-mask-composite: source-in;
      mask-image: var(--silhouette), radial-gradient(ellipse 65% 84% at 50% 30%, black 24%, transparent 85%);
      mask-composite: intersect;
    }
    .ambient-composition.is-group { aspect-ratio: 1.6; }
    .ambient-composition.is-composite { top: 8%; }
    :is(#curb-plate, #crossroads-plate, #timberline-plate) { --bleed: 36px; }

    .ferros-immersive-stage {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0 36px;
      scroll-margin-top: 0;
    }
    .ferros-backdrop { display: contents; }
    :is(#ferros-plate, #pell-plate, #vael-plate) {
      position: relative;
      top: auto;
      right: auto;
      width: calc(100% + 72px);
      height: auto;
      aspect-ratio: 16 / 9;
      margin: 0 -36px -80px;
      --side-fade: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
      --end-fade: linear-gradient(to bottom, black 55%, rgba(0,0,0,0.6) 74%, transparent 98%);
    }
    :is(#ferros-plate, #pell-plate, #vael-plate).gaze-locked { transform: none; }
    :is(#ferros-plate, #pell-plate, #vael-plate) img, :is(#ferros-plate, #pell-plate, #vael-plate) video {
      transition: opacity 0.9s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    :is(#ferros-plate, #pell-plate, #vael-plate).gaze-locked :is(img, video) { transform: scale(1.045); }
    .ferros-prose-overlay {
      width: min(100%, 600px);
      max-width: 100%;
      margin: 0 auto;
      padding: 0 0 28px;
    }
  }

  /* On tablets the portrait stays in the page flow, beside the beat being read. */
  @media (680px < width <= 1024px) {
    .ferros-immersive-stage:has(.gaze-locked) {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .ferros-immersive-stage:has(.gaze-locked) .ferros-prose-overlay { display: contents; }
    .ferros-prose-overlay > :is(p, :is(#ferros-resolution, #pell-resolution, #vael-resolution)) {
      width: min(100%, 600px);
      margin-inline: auto;
    }
    :is(#ferros-plate, #pell-plate, #vael-plate).gaze-locked { order: 1; }
    :is(#ferros-resolution, #pell-resolution, #vael-resolution) {
      order: 2;
      position: relative;
      z-index: 2;
      scroll-margin-top: min(calc(56.25vw - 80px), 60svh);
    }
  }

  @media (max-width: 680px) {
    body { font-size: 17.5px; line-height: 1.72; }
    .stage { padding: 28vh 22px 110px; }
    .manuscript { max-width: none; padding-top: 0; }
    .kaiya-ambient-presence {
      left: 0;
      right: 0;
      width: 100vw;
      height: 44vh;
      opacity: 0.34;
    }
    :is(#curb-plate, #crossroads-plate, #timberline-plate) { width: 100vw; margin: -12px -22px -18px; }
    .ferros-immersive-stage {
      --pinned-height: min(56.25vw, 48svh);
      padding: 0 22px;
    }
    :is(#ferros-plate, #pell-plate, #vael-plate) {
      position: sticky;
      top: 0;
      width: 100vw;
      max-height: var(--pinned-height);
      margin: 0 -22px -48px;
      z-index: 2;
      mix-blend-mode: normal;
      background: #141210;
      --phone-fade: linear-gradient(to bottom, black 64%, rgba(0,0,0,0.92) 76%, transparent 100%);
      -webkit-mask-image: var(--phone-fade);
      mask-image: var(--phone-fade);
    }
    :is(#ferros-plate, #pell-plate, #vael-plate) :is(img, video) {
      object-fit: contain;
      -webkit-mask-image: var(--end-fade);
      mask-image: var(--end-fade);
    }
    .ferros-prose-overlay { z-index: 1; }
    :is(#ferros-resolution, #pell-resolution, #vael-resolution), :is(#ferros-box, #pell-box, #vael-box) :is(input, button) {
      scroll-margin-top: calc(var(--pinned-height) - 32px);
    }
    :is(#ferros-resolution, #pell-resolution, #vael-resolution):not(:empty) { min-height: calc(100svh - var(--pinned-height)); }
  }

  html:has(body.overture-lock), body.overture-lock { overflow: hidden; overscroll-behavior: none; }
  body.overture-lock {
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    touch-action: pinch-zoom;
  }
  .overture-lock #kaiya-presence { opacity: 0.08; }
  .overture-lock main, .overture-lock .stage, .overture-lock .manuscript, .overture-lock #chapter-content {
    width: 100%; height: 100%; max-width: none; margin: 0; padding: 0;
  }
  .overture-lock #chapter-content { display: grid; place-items: center; }
  .overture-lock .chapter-meta, .overture-lock #storage-status {
    position: absolute;
    width: min(92vw, 1120px);
    inset-inline: 0;
    margin: 0 auto;
    z-index: 4;
  }
  .overture-lock .chapter-meta { top: max(env(safe-area-inset-top), clamp(10px, 2.8vh, 30px)); }
  .overture-lock #storage-status { bottom: max(4px, env(safe-area-inset-bottom)); text-align: center; }
  .overture-stage {
    --stage-height: min(calc(100dvh - 140px), 760px);
    --recede-y: -135px;
    --vanish-y: -230px;
    position: relative;
    width: 100%;
    height: calc(100vh - 140px);
    height: var(--stage-height);
    max-height: 760px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  #overture-plate {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: min(92vw, 1120px);
    height: 100%;
    margin: 0 auto;
    display: grid;
    place-items: center;
    mix-blend-mode: lighten;
    --relic-mask: radial-gradient(ellipse 78% 74% at 50% 46%, #000 38%, rgba(0,0,0,0.55) 68%, transparent 96%);
    -webkit-mask-image: var(--relic-mask);
    mask-image: var(--relic-mask);
  }
  .overture-frame {
    position: relative;
    width: min(100%, calc(var(--stage-height) * 16 / 9));
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: radial-gradient(ellipse at 32% 62%, #453822, #1b1914 43%, var(--bg) 76%);
    -webkit-mask-image: linear-gradient(transparent, black 9%, black 85%, transparent);
    mask-image: linear-gradient(transparent, black 9%, black 85%, transparent);
  }
  .overture-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 64%, rgba(17,16,14,0.78) 97%);
  }
  #overture-plate video, #overture-pickup-still { opacity: 0; }
  #overture-plate .playing, .pickup-held #overture-pickup-still { opacity: 1; }
  .pickup-held #overture-idle-still { opacity: 0; }
  #overture-plate.exchange-ended img { transition: none; }
  .overture-air {
    position: absolute;
    inset: 0;
    transition: opacity 0.5s ease;
  }
  #overture-plate:has(.playing) .overture-air { opacity: 0; }
  .overture-air::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 23% 57%, #d4b77b 0.6px, transparent 2px),
                radial-gradient(circle at 37% 38%, #a9986c 0.7px, transparent 2px),
                radial-gradient(circle at 48% 27%, #e1cb9b 0.6px, transparent 1.5px),
                radial-gradient(circle at 55% 53%, #ccb183 0.8px, transparent 2px);
    animation: overtureDust 7s ease-in-out infinite alternate;
  }
  .overture-air::after {
    content: "";
    position: absolute;
    left: 28%; top: 65%; width: 8%; height: 10%;
    border-radius: 50%;
    transform: rotate(-19deg);
    background: linear-gradient(116deg, transparent 46%, #98ac86 48%, transparent 51%),
                radial-gradient(ellipse at 34% 40%, #587353, #1e3828 52%, transparent 74%);
    opacity: 0.38;
  }
  @keyframes overtureDust {
    from { transform: translate(-0.4%, 1%); opacity: 0.25; }
    to { transform: translate(1%, -1.5%); opacity: 0.7; }
  }
  .overture-carousel {
    --subtitle-inset: 6vh;
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 0 28px var(--subtitle-inset);
    pointer-events: none;
  }
  .overture-beat {
    position: absolute;
    bottom: var(--subtitle-inset);
    width: min(88vw, 660px);
    text-align: center;
    text-shadow: 0 2px 24px rgba(10,9,8,0.98), 0 0 40px rgba(10,9,8,0.92), 0 1px 4px #0a0908;
    transform-origin: center bottom;
    transition: transform 1.1s cubic-bezier(0.22,1,0.36,1), opacity 1.1s ease, filter 1.1s ease;
  }
  .overture-beat.is-upcoming {
    opacity: 0; transform: translate3d(0,38px,0) scale(0.98); filter: blur(4px); pointer-events: none;
  }
  .overture-beat.is-active {
    z-index: 1; opacity: 1; transform: translate3d(0,0,0) scale(1); filter: blur(0); pointer-events: auto;
  }
  .overture-beat.is-receded {
    opacity: 0.24; transform: translate3d(0,var(--recede-y),0) scale(0.86); filter: blur(0.6px); pointer-events: none;
  }
  .overture-beat.is-vanished {
    opacity: 0; transform: translate3d(0,var(--vanish-y),0) scale(0.78); filter: blur(3px); pointer-events: none;
  }
  .departing .overture-beat.is-receded {
    opacity: 0.14;
    transform: translate3d(0, min(var(--recede-y), calc(var(--stage-height) * -0.53)), 0) scale(0.86);
  }
  .overture-beat:not(.is-active) button { visibility: hidden; }
  .overture-beat button { text-shadow: inherit; background-color: rgba(17,16,14,0.65); }
  .overture-line {
    margin: 0 0 0.75em;
    font-size: clamp(1.05rem, 1.9vw, 1.375rem);
    line-height: 1.4;
  }
  .overture-line:focus { outline: none; }
  @media (max-width: 680px) {
    .overture-lock .chapter-meta { gap: 4px 12px; }
    .overture-stage { --recede-y: clamp(-205px, -24dvh, -184px); --vanish-y: calc(var(--recede-y) - 95px); }
    .overture-carousel { --subtitle-inset: max(4dvh, calc(50% - 35vw - 70px)); }
  }
  @media (max-width: 680px) and (orientation: portrait) {
    .overture-frame { aspect-ratio: 1.32; }
    .overture-frame :is(img, video) { object-position: 70% center; }
  }
  @media (max-height: 520px) {
    .overture-stage { --stage-height: calc(100dvh - 76px); --recede-y: -135px; }
    .overture-carousel { --subtitle-inset: 8px; }
    .overture-line { font-size: 1rem; line-height: 1.25; margin-bottom: 0.4em; }
    .overture-beat button { padding-block: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .overture-air::before { animation: none; }
    .overture-air, .overture-beat { transition: none; }
    .timberline-mist-veil { filter: none; transition: none; }
    .mist-warning { display: none; }
    .cedar-fog, .kaiya-ambient-presence.timberline-presence { transform: none; transition: none; }
    body.mode-flattery .manuscript.roar-shake, .roar-shake .cul-de-sac::before { animation: none; }
    .visual-plate video { display: none; }
    .visual-plate img, .visual-plate video, :is(#ferros-plate, #pell-plate, #vael-plate), :is(#ferros-plate, #pell-plate, #vael-plate)::after,
    :is(#curb-img, #crossroads-img, #timberline-img), .kaiya-ambient-presence,
    .ambient-layer, .timberline-presence .ambient-composition { transition: none; }
    .field-bridge, .cul-de-sac, .canon-continuation { animation: none; }
    :is(#ferros-plate, #pell-plate, #vael-plate).gaze-locked { transform: none; }
    :is(#ferros-plate, #pell-plate, #vael-plate).gaze-locked :is(img, video) { transform: none; }
    :is(#ferros-plate, #pell-plate, #vael-plate) :is(img, video) { transition: none; }
  }
</style>
</head>
<body>

<main>
<div class="kaiya-ambient-presence" id="kaiya-presence" aria-hidden="true"></div>
<div class="stage" id="stage">
  <section class="manuscript">
    <header class="chapter-meta">
      <nav aria-label="Chapters">
        <span>The Yellow Brick Code //</span><span id="chapter-links"></span>
      </nav>
      <span id="chapter-readout" aria-live="polite" hidden></span>
      <button class="reset-journey" id="reset-journey" type="button">Reset Journey</button>
    </header>
    <p id="storage-status" role="status" hidden></p>
    <div id="chapter-content" tabindex="-1"></div>
  </section>
</div>
<div id="chapter-scenes"></div>
</main>

<script>window.YBC_CHAPTERS = Object.create(null);</script>
<script src="chapters/threshold.js"></script>
<script src="chapters/ch00.js"></script>
<script src="chapters/ch01.js"></script>
<script src="chapters/ch02.js"></script>
<script src="chapters/ch03.js"></script>
<script>
(() => {
  const storageKey = 'ybc_journey_state';
  const chapters = window.YBC_CHAPTERS;
  const chapterIds = Object.keys(chapters).map(Number).sort((a, b) => a - b);
  const content = document.getElementById('chapter-content');
  const scenes = document.getElementById('chapter-scenes');
  const presence = document.getElementById('kaiya-presence');
  const companions = ['kaiya', 'ferros', 'pell', 'vael'];
  const links = document.getElementById('chapter-links');
  const storageStatus = document.getElementById('storage-status');
  let controller;
  let dispose;

  function freshJourney() {
    return { currentChapter: 0, postureMode: 'uncalibrated', completedChapters: [], responses: {} };
  }

  function storageUnavailable() {
    storageStatus.textContent = 'Your place can only be kept while this page is open.';
    storageStatus.hidden = false;
  }

  function unlocked(id, state) {
    return chapterIds.includes(id) && (id === 0 || state.completedChapters.includes(id - 1));
  }

  function postureForChapter(state, fallback) {
    if (state.currentChapter === 0) return 'uncalibrated';
    const chapter = chapters[state.currentChapter];
    if (state.completedChapters.includes(state.currentChapter) || state.responses[chapter.fieldResponse]) return 'field';
    return fallback || chapter.initialPosture || 'uncalibrated';
  }

  function readJourney() {
    const state = freshJourney();
    let raw;
    try { raw = localStorage.getItem(storageKey); }
    catch { storageUnavailable(); return state; }
    if (!raw) return state;
    let saved;
    try { saved = JSON.parse(raw); }
    catch { return state; }
    if (!saved || typeof saved !== 'object') return state;
    if (saved.responses && typeof saved.responses === 'object') {
      state.responses = Object.fromEntries(Object.entries(saved.responses).filter(([, value]) => typeof value === 'string' && value.trim()));
    }
    state.completedChapters = chapterIds.filter(id =>
      (Array.isArray(saved.completedChapters) && saved.completedChapters.includes(id)) ||
      (chapters[id].completionResponse && Object.hasOwn(state.responses, chapters[id].completionResponse))
    );
    // A reader already on the road before the Overture shipped keeps access to the curb.
    if (!state.completedChapters.includes(0) && chapterIds.includes(saved.currentChapter) && saved.currentChapter > 0) {
      state.completedChapters.unshift(0);
    }
    if (unlocked(saved.currentChapter, state)) state.currentChapter = saved.currentChapter;
    // Refreshing during the departure takes the reader to the destination they chose.
    if (state.currentChapter === 0 && state.completedChapters.includes(0) && saved.checkpoint === 'overture-departing') {
      state.currentChapter = 1;
      delete saved.checkpoint;
    }
    const savedPosture = ['flattery', 'cynic', 'field', 'uncalibrated'].includes(saved.postureMode) ? saved.postureMode : null;
    state.postureMode = postureForChapter(state, savedPosture);
    if (typeof saved.checkpoint === 'string') state.checkpoint = saved.checkpoint;
    return state;
  }

  let journey = readJourney();

  function saveJourney() {
    try { localStorage.setItem(storageKey, JSON.stringify(journey)); }
    catch { storageUnavailable(); }
  }

  function applyPosture() {
    document.body.classList.remove('mode-flattery', 'mode-cynic', 'mode-field');
    if (journey.postureMode !== 'uncalibrated') document.body.classList.add('mode-' + journey.postureMode);
  }

  function updateFellowship() {
    const size = journey.responses.ch03_vael || journey.completedChapters.includes(3)
      ? companions.length : Math.max(1, Math.min(journey.currentChapter, companions.length));
    if (presence.dataset.size === String(size)) return;
    presence.dataset.size = String(size);
    const group = document.createElement('div');
    group.className = size === 1 ? 'ambient-composition' : 'ambient-composition is-group';
    presence.replaceChildren(group);

    function showAnchors() {
      if (!group.isConnected) return;
      group.classList.toggle('is-composite', size > 1);
      group.replaceChildren(...companions.slice(0, size).map(name => {
        const image = new Image();
        image.className = 'ambient-layer companion-' + name;
        image.alt = '';
        image.onerror = () => image.remove();
        image.src = 'assets/ref/' + name + '-anchor.png';
        return image;
      }));
    }
    if (size === 1) {
      showAnchors();
      return;
    }
    const plate = new Image();
    plate.className = 'ambient-layer';
    plate.alt = '';
    plate.hidden = true;
    plate.onload = () => { plate.hidden = false; };
    plate.onerror = showAnchors;
    group.append(plate);
    plate.src = 'assets/ref/fellowship-ch0' + size + '.png';
  }

  function updateLinks() {
    for (const button of links.querySelectorAll('button')) {
      const id = Number(button.dataset.chapter);
      button.disabled = !unlocked(id, journey);
      if (id === journey.currentChapter) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    }
  }

  function record({ postureMode, responses, checkpoint, complete }) {
    if (postureMode) journey.postureMode = postureMode;
    if (responses) Object.assign(journey.responses, responses);
    if (checkpoint) journey.checkpoint = checkpoint;
    else delete journey.checkpoint;
    if (complete && !journey.completedChapters.includes(journey.currentChapter)) {
      journey.completedChapters.push(journey.currentChapter);
    }
    saveJourney();
    applyPosture();
    if (complete) updateFellowship();
    updateLinks();
  }

  function unmount() {
    controller?.abort();
    dispose?.();
    for (const video of document.querySelectorAll('main video')) {
      video.pause();
      video.removeAttribute('src');
      for (const source of video.querySelectorAll('source')) source.removeAttribute('src');
      video.load();
    }
    scenes.replaceChildren();
    content.replaceChildren();
  }

  function render(resuming = false) {
    unmount();
    controller = new AbortController();
    const chapter = chapters[journey.currentChapter];
    document.title = 'The Yellow Brick Code — ' + chapter.title;
    document.body.classList.toggle('overture-lock', journey.currentChapter === 0);
    applyPosture();
    updateFellowship();
    updateLinks();
    window.scrollTo({ top: 0, behavior: 'instant' });
    dispose = chapter.mount({ content, scenes, journey, record, resuming, signal: controller.signal });
    if (!resuming) content.focus({ preventScroll: true });
  }

  function loadChapter(id) {
    if (!unlocked(id, journey)) return;
    if (id !== journey.currentChapter) {
      journey.currentChapter = id;
      journey.postureMode = postureForChapter(journey);
      delete journey.checkpoint;
      saveJourney();
      render();
    } else {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }

  document.getElementById('reset-journey').addEventListener('click', () => {
    journey = freshJourney();
    saveJourney();
    render();
  });

  for (const id of chapterIds) {
    if (links.childElementCount) links.append(' · ');
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.chapter = id;
    button.textContent = String(id).padStart(2, '0');
    button.setAttribute('aria-label', 'Chapter ' + id + ', ' + chapters[id].title);
    button.addEventListener('click', () => loadChapter(id));
    links.append(button);
  }

  window.YBC = { loadChapter };
  history.scrollRestoration = 'manual';
  saveJourney();
  render(true);
})();
</script>
</body>
</html>
